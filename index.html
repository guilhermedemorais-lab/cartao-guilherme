<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guilherme de Morais</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#003d6b;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:20px;
    font-family:Arial, Helvetica, sans-serif;
}

.container{
    position:relative;
    width:100%;
    max-width:500px;
}

.cartao{
    width:100%;
    display:block;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

/* TODAS AS ÁREAS CLICÁVEIS */

.click-area{
    position:absolute;
    display:block;
    z-index:1000;
    border-radius:18px;
    cursor:pointer;
}

/* DESCOMENTE PARA AJUSTAR AS ÁREAS VISUALMENTE */

/*
.click-area{
    background:rgba(255,0,0,.20);
}
*/

/* BOTÃO ADICIONAR CONTATO */

.add-contact{
    left:22%;
    top:42%;
    width:56%;
    height:6%;
}

/* CARD TELEFONE */

.whatsapp{
    left:8%;
    top:53%;
    width:84%;
    height:7.2%;
}

/* CARD E-MAIL */

.email{
    left:8%;
    top:60.5%;
    width:84%;
    height:7.2%;
}

/* CARD SITE */

.site{
    left:8%;
    top:68%;
    width:84%;
    height:7.2%;
}

/* CARD INSTAGRAM */

.instagram{
    left:8%;
    top:75.5%;
    width:84%;
    height:7.2%;
}

</style>
</head>

<body>

<div class="container">

    <img
        class="cartao"
        src="Designer_Final.png"
        alt="Cartão Digital">

    <!-- ADICIONAR CONTATO -->
    <a
        class="click-area add-contact"
        href="Guilherme_de_Morais.vcf"
        title="Adicionar Contato">
    </a>

    <!-- TELEFONE -->
    <a
        class="click-area whatsapp"
        href="tel:+5518996057468"
        title="Ligar">
    </a>

    <!-- E-MAIL -->
    <a
        class="click-area email"
        href="mailto:guilherme.morais@integraps.com.br"
        title="Enviar Email">
    </a>

    <!-- SITE -->
    <a
        class="click-area site"
        href="https://www.integraps.com.br"
        target="_blank"
        title="Site">
    </a>

    <!-- INSTAGRAM -->
    <a
        class="click-area instagram"
        href="https://www.instagram.com/integra.solucoes.projetos/"
        target="_blank"
        title="Instagram">
    </a>

</div>

</body>
</html>
