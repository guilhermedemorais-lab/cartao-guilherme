<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guilherme de Morais</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#003d6b;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:20px;
    font-family:'Segoe UI',sans-serif;
}

.container{
    position:relative;
    width:100%;
    max-width:500px;
}

.cartao{
    width:100%;
    display:block;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

/* Área clicável do botão */

.add-contact{
    position:absolute;
    left:22%;
    top:44%;
    width:56%;
    height:6%;
    z-index:999;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<img
class="cartao"
src="Designer_Final.png"
alt="Cartão Digital">

<a
class="add-contact"
href="Guilherme_de_Morais.vcf"
download
title="Adicionar contato">
</a>

</div>

</body>

</html>
